name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes (incluem os testes anti-fuga de dados)
        run: python -m pytest -q tests
      - name: Os scripts compilam
        run: python -m compileall -q src scripts app
